version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    # Dependency updates are integrated like any other change and reach main through release.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # A package goes to the first group that matches it, so the test group comes first.
    groups:
      test-tooling:
        patterns:
          - 'Microsoft.NET.Test.Sdk'
          - 'Microsoft.AspNetCore.Mvc.Testing'
          - 'Microsoft.Extensions.TimeProvider.Testing'
          - 'xunit*'
          - 'coverlet*'
      aspnetcore-and-efcore:
        patterns:
          - 'Microsoft.AspNetCore.*'
          - 'Microsoft.EntityFrameworkCore*'
          - 'Microsoft.Extensions.*'
    ignore:
      # Major versions follow the .NET release (net10.0 -> net11.0) and need a manual migration in a personal branch.
      - dependency-name: 'Microsoft.*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Mexico_City
    commit-message:
      prefix: chore(deps)
