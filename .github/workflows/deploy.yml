name: Deploy

# main deploys production and release deploys QA: same pipeline, each with its own App Service, database and secrets.
on:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AZURE_WEBAPP_NAME: ${{ github.ref_name == 'main' && 'app-itacr-backend-prod' || 'app-itacr-backend-qa' }}
  AZURE_RESOURCE_GROUP: rg-itacr-prod-westus
  AZURE_SQL_SERVER: itacr-sql
  SOLUTION: Itacr.slnx
  API_PROJECT: src/Itacr.Api/Itacr.Api.csproj
  MIGRATOR_PROJECT: database/Itacr.Database.Migrator/Itacr.Database.Migrator.csproj

jobs:
  build:
    if: github.ref_name == 'main' || github.ref_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      # One test project at a time (-m:1), so at most two SQL Server containers share the 8 GB of the runner.
      - name: Run tests
        run: dotnet test "$SOLUTION" --configuration Release --no-build -m:1

      - name: Publish API
        run: dotnet publish "$API_PROJECT" --configuration Release --no-build --output artifacts/api

      - name: Publish database migrator
        run: dotnet publish "$MIGRATOR_PROJECT" --configuration Release --no-build --output artifacts/migrator

      - name: Upload API package
        uses: actions/upload-artifact@v7
        with:
          name: api
          path: artifacts/api
          if-no-files-found: error
          retention-days: 3

      - name: Upload database migrator
        uses: actions/upload-artifact@v7
        with:
          name: migrator
          path: artifacts/migrator
          if-no-files-found: error
          retention-days: 3

  # The schema changes are additive, so they are applied before the new API starts.
  migrate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: global.json
          sparse-checkout-cone-mode: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download database migrator
        uses: actions/download-artifact@v8
        with:
          name: migrator
          path: migrator

      # OIDC: the service principal only has SQL Server Contributor on itacr-sql, to open a firewall rule.
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Allow the runner through the Azure SQL firewall
        id: firewall
        run: |
          runner_ip=$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)
          rule_name="github-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "rule=$rule_name" >> "$GITHUB_OUTPUT"
          az sql server firewall-rule create \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$AZURE_SQL_SERVER" \
            --name "$rule_name" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip" \
            --output none

      - name: Run database migrator
        env:
          DOTNET_ENVIRONMENT: Production
          ConnectionStrings__Migrator: ${{ github.ref_name == 'main' && secrets.SQL_MIGRATOR_CONNECTION_STRING || secrets.SQL_MIGRATOR_QA_CONNECTION_STRING }}
          Seed__TestEmployees: ${{ github.ref_name == 'release' }}
        run: dotnet migrator/Itacr.Database.Migrator.dll

      - name: Remove the runner firewall rule
        if: always() && steps.firewall.outputs.rule != ''
        env:
          FIREWALL_RULE: ${{ steps.firewall.outputs.rule }}
        run: |
          az sql server firewall-rule delete \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$AZURE_SQL_SERVER" \
            --name "$FIREWALL_RULE" \
            --output none

  deploy:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download API package
        uses: actions/download-artifact@v8
        with:
          name: api
          path: api

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ github.ref_name == 'main' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE || secrets.AZURE_WEBAPP_QA_PUBLISH_PROFILE }}
          package: api
