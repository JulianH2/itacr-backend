name: Xygeni Scan

# Code quality and security analysis with Xygeni (ITACR-50): on every PR into the long-lived branches, every night,
# and by hand. Results are in the Xygeni dashboard (in.xygeni.io), project JulianH2/<repository>.
on:
  pull_request:
    branches: ['sprint-*', develop, release, main]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xygeni-scan:
    name: Xygeni Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Xygeni scanner
        uses: xygeni/xygeni-action@4c800b1936f3edef2021f82a2e1dfb740e48d832
        with:
          xygeni_url: https://api.xygeni.io
          token: ${{ secrets.XYGENI_TOKEN }}
          gh_token: ${{ secrets.GITHUB_TOKEN }}
