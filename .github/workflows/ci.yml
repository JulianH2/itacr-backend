name: CI

on:
  pull_request:
    branches: ['sprint-*', develop, release, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate source and target branches
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          KEBAB='[a-z0-9]+(-[a-z0-9]+)*'
          case "$BASE_REF" in
            sprint-*)
              pattern="^(feature|fix|docs|refactor|test|chore)/ITACR-[0-9]+-${KEBAB}$"
              expected='<type>/ITACR-<N>-<short-description> (type: feature, fix, docs, refactor, test, chore)'
              ;;
            develop)
              pattern='^(sprint-[0-9]{2,}|main|sync/main-into-develop|dependabot/.+)$'
              expected='sprint-XX, or main for a back-merge'
              ;;
            release)
              pattern='^(develop|main|sync/main-into-release)$'
              expected='develop, or main for a back-merge'
              ;;
            main)
              pattern="^(release|hotfix/ITACR-[0-9]+-${KEBAB}|release-please--.+)$"
              expected='release, hotfix/ITACR-<N>-<short-description>, or the release-please branch'
              ;;
            *)
              echo "No branch rules for target '$BASE_REF'."
              exit 0
              ;;
          esac

          if [[ "$HEAD_REF" =~ $pattern ]]; then
            echo "OK: '$HEAD_REF' -> '$BASE_REF'"
          else
            echo "::error::Branch '$HEAD_REF' cannot open a PR into '$BASE_REF'. Expected: $expected. See CONTRIBUTING.md, section 2."
            exit 1
          fi

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Git hooks are only useful on developer machines.
      HUSKY: 0
      # Placeholder so Prisma commands that read the configuration do not fail. No database is used.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # The NestJS app (ITACR-26) and the Prisma schema (ITACR-27) do not exist yet.
      # Until they do, the steps below are skipped with a notice instead of failing.
      # Detection: nest-cli.json marks the NestJS app; any *.prisma file in prisma/ marks the schema.
      - name: Detect scaffolded project
        id: project
        run: |
          if [ -f nest-cli.json ]; then
            echo "nest=true" >> "$GITHUB_OUTPUT"
          else
            echo "nest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::nest-cli.json not found: lint, tests, and build are skipped until the NestJS app exists (ITACR-26)."
          fi
          if find prisma -name '*.prisma' -print -quit 2>/dev/null | grep -q .; then
            echo "prisma=true" >> "$GITHUB_OUTPUT"
          else
            echo "prisma=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Prisma schema found: prisma validate and generate are skipped until ITACR-27."
          fi

      - name: Validate Prisma schema and generate the client
        if: steps.project.outputs.prisma == 'true'
        run: |
          npx prisma validate
          npx prisma generate

      - name: Lint
        if: steps.project.outputs.nest == 'true'
        run: npm run lint

      - name: Run unit tests
        if: steps.project.outputs.nest == 'true'
        run: npm test

      - name: Build
        if: steps.project.outputs.nest == 'true'
        run: npm run build
